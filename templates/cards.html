{% for job in matches %}<article class="jobcard"><div><span class="eyebrow">{{ job.department }}</span><h3><a href="/jobs/{{ job.id }}">{{ job.title }}</a></h3><p>{{ job.summary }}</p><div class="meta"><span>Job ID {{ job.id }}</span><span>Full-time*</span><span>{{ job.experience }}*</span></div><div class="tags">{% for skill in job.skills %}<span>{{ skill }}</span>{% endfor %}</div></div><a class="textlink" href="/jobs/{{ job.id }}">View role <span aria-hidden="true">↗</span></a></article>{% endfor %}
